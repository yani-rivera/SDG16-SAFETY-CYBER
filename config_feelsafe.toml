# biv_web — turns a `bivariate` 2.x GeoPackage into data for the interactive page

[input]
gpkg = "data/bivariate_feelsafe.gpkg"
layer = "bivariate"

[labels]
# what INDEX_A and INDEX_B measure (confirm against the bivariate run's config.json)
a = "Feel safe walking alone at night"
b = "Cyber-dependent crime (GI-TOC 2025)"
a_short = "sense of safety"
a_unit = "%"
key = "feelsafe"
tab = "Feeling safe"
b_short = "cyber crime"
source = "A: Gallup, Global Safety Report 2025, share of adults who feel safe walking alone at night in the city or area where they live (https://www.gallup.com/analytics/356996/gallup-global-safety-research-center.aspx). B: Global Initiative Against Transnational Organized Crime (GI-TOC), Global Organized Crime Index 2025 (CC BY 4.0)"

[geometry]
simplify_m = 6000        # Douglas-Peucker tolerance in metres (EPSG:8857)
round_m = 100            # coordinate rounding in metres

[output]
dir = "docs/data/feelsafe"
