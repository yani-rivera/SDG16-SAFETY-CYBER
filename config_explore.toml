# biv_web, explorer mode: the reader picks the two variables of the bivariate map.
#   python -m biv_web config_explore.toml   ->  docs/data/explore/
# Paths are relative to this file.

mode = "explore"

[input]
# Country polygons (EPSG:8857) are taken from a `bivariate` GeoPackage; its values are not used.
gpkg = "data/bivariate.gpkg"
layer = "bivariate"
legend = "data/legend.json"      # the 3x3 colours come from the bivariate run

[tables.gitoc]
# from the crime_flat pipeline
file = "data/gitoc_oc_index_wide.csv"
key = "iso3"
where = { year = 2025 }
provenance = "data/crime_flat_provenance.json"

[tables.gallup]
# from the crime_flat pipeline. Gallup states no open licence: this file is git-ignored.
file = "data/gallup_safety_2025.csv"
key = "iso3"
provenance = "data/crime_flat_provenance.json"

[geometry]
simplify_m = 6000        # Douglas-Peucker tolerance in metres (EPSG:8857)
round_m = 100            # coordinate rounding in metres

[output]
dir = "docs/data/explore"

[page]
kicker = "Interactive companion · Pick two measures · #30DayMapChallenge 2026"
author = "Yanira A. Rivera"
how_to = "Pick one measure for each side of the legend. The map sorts every country into low, middle or high on each, and colours it by the combination. Tap a square in the legend to see one group, or find a country."

# The pair shown when the page opens.
[default]
a = "safe_walking_night_pct"
b = "cyber_dependent_crimes"

# Ready-made pairs offered as buttons, each with its own title and one-line explanation.
# Any other pair gets a title made from the two labels.
[[presets]]
a = "safe_walking_night_pct"
b = "cyber_dependent_crimes"
title = "Feeling Safe, Exposed Online"
blurb = "How safe people feel walking alone at night where they live, set against how strong cyber crime is in their country. A street can feel safe while hacking and ransomware thrive behind the screens."

[[presets]]
a = "resilience_avg"
b = "criminality_avg"
title = "The Strength to Resist"
blurb = "How strong a country's defences against organized crime are, set against how much organized crime it has."

[[presets]]
a = "safe_walking_night_pct"
b = "criminality_avg"
title = "Does Feeling Safe Match the Crime?"
blurb = "How safe people say they feel at night, set against how much organized crime experts find in their country."

[[presets]]
a = "safe_walking_night_pct"
b = "law_enforcement"
title = "Feeling Safe and the Police"
blurb = "How safe people feel at night, set against how well law enforcement is judged to deal with organized crime."

[[groups]]
key = "feel"
label = "How people feel (survey)"
[[groups]]
key = "crime"
label = "Organized crime (expert scores)"
[[groups]]
key = "defence"
label = "Defences against crime (expert scores)"

[sources]
gallup = "Gallup, Global Safety Report 2025 (survey fieldwork 2024). https://www.gallup.com/analytics/356996/gallup-global-safety-research-center.aspx"
gitoc = "Global Initiative Against Transnational Organized Crime (GI-TOC), Global Organized Crime Index 2025 (CC BY 4.0). https://ocindex.net"
boundaries = "Natural Earth, Equal Earth projection."

# ---------------------------------------------------------------------------------------------
# The variables the reader can choose from.
#   label        name in the pickers, the title and the axes
#   short        used inside sentences: "low <short>, high <short>"
#   phrase       completes "This map compares <phrase> with <phrase>."
#   higher_is    "better" or "worse": what a high value means for the people who live there
#   description  one or two plain sentences shown under the map
# ---------------------------------------------------------------------------------------------

[[variables]]
key = "safe_walking_night_pct"
table = "gallup"
field = "safe_walking_night_pct"
label = "Feeling safe at night"
short = "feeling of safety"
phrase = "how safe people feel walking alone at night"
unit = "%"
decimals = 0
higher_is = "better"
group = "feel"
source = "gallup"
description = "Gallup asks adults: \"Do you feel safe walking alone at night in the city or area where you live?\" The value is the share who answer yes. It measures how safe people feel, which can differ from how much crime there is."

[[variables]]
key = "law_and_order_index"
table = "gallup"
field = "law_and_order_index"
label = "Law and order, as people live it"
short = "law and order"
phrase = "how secure people's daily lives are"
unit = ""
decimals = 0
higher_is = "better"
group = "feel"
source = "gallup"
description = "Gallup's Law and Order Index (0 to 100) combines four survey answers: confidence in the local police, feeling safe walking alone at night, and whether the person was robbed or assaulted in the past year. Higher means people feel and are more secure. Gallup lists it for fewer countries than the question above."

[[variables]]
key = "criminality_avg"
table = "gitoc"
field = "criminality_avg"
label = "Organized crime overall"
short = "organized crime"
phrase = "how much organized crime a country has"
decimals = 2
higher_is = "worse"
group = "crime"
source = "gitoc"
description = "The GI-TOC criminality score (1 to 10): the average of how large the country's criminal markets are and how strong its criminal groups are. It is an expert assessment, not a count of crimes."

[[variables]]
key = "criminal_markets_avg"
table = "gitoc"
field = "criminal_markets_avg"
label = "Illegal markets"
short = "illegal markets"
phrase = "how large illegal markets are"
decimals = 2
higher_is = "worse"
group = "crime"
source = "gitoc"
description = "Average expert score (1 to 10) across 15 illegal markets, among them human trafficking, arms, drugs, wildlife, counterfeit goods, extortion, financial crime and cyber crime."

[[variables]]
key = "criminal_actors_avg"
table = "gitoc"
field = "criminal_actors_avg"
label = "Criminal groups"
short = "criminal groups"
phrase = "how strong criminal groups are"
decimals = 2
higher_is = "worse"
group = "crime"
source = "gitoc"
description = "Average expert score (1 to 10) for the reach and influence of five kinds of criminal actor: mafia-style groups, looser criminal networks, actors inside the state, foreign actors and private-sector actors."

[[variables]]
key = "cyber_dependent_crimes"
table = "gitoc"
field = "cyber_dependent_crimes"
label = "Cyber crime"
short = "cyber crime"
phrase = "how strong cyber crime is"
decimals = 1
higher_is = "worse"
group = "crime"
source = "gitoc"
description = "Crimes that exist only because of computers and networks: hacking and data theft, ransomware, malware, and attacks that knock websites offline. The score (1 to 10) is an expert judgement of how large and harmful this market is in or from the country. A high score can mean a country is a base for cyber criminals as much as a target."

[[variables]]
key = "financial_crimes"
table = "gitoc"
field = "financial_crimes"
label = "Financial crime"
short = "financial crime"
phrase = "how widespread organized financial crime is"
decimals = 1
higher_is = "worse"
group = "crime"
source = "gitoc"
description = "Organized fraud, embezzlement, misuse of funds and tax evasion. Expert score from 1 to 10."

[[variables]]
key = "resilience_avg"
table = "gitoc"
field = "resilience_avg"
label = "Resilience to organized crime"
short = "resilience"
phrase = "how strong a country's defences against organized crime are"
decimals = 2
higher_is = "better"
group = "defence"
source = "gitoc"
description = "A country's ability to withstand and disrupt organized crime through its institutions and society. It averages 12 expert-scored indicators (1 to 10), from political leadership and the courts to prevention and civil society. A high score means strong defences; it does not say how much crime there is."

[[variables]]
key = "national_policies_and_laws"
table = "gitoc"
field = "national_policies_and_laws"
label = "Laws against organized crime"
short = "strength of its laws"
phrase = "how good the laws and policies against organized crime are"
decimals = 1
higher_is = "better"
group = "defence"
source = "gitoc"
description = "Whether the country has laws, strategies and policies that address organized crime. Expert score from 1 to 10."

[[variables]]
key = "law_enforcement"
table = "gitoc"
field = "law_enforcement"
label = "Police and law enforcement"
short = "strength of law enforcement"
phrase = "how well law enforcement deals with organized crime"
decimals = 1
higher_is = "better"
group = "defence"
source = "gitoc"
description = "The state's ability to investigate organized crime, gather intelligence and enforce the law. Expert score from 1 to 10."

[[variables]]
key = "judicial_system_and_detention"
table = "gitoc"
field = "judicial_system_and_detention"
label = "Courts and prisons"
short = "strength of courts and prisons"
phrase = "how well the courts and prisons handle organized crime"
decimals = 1
higher_is = "better"
group = "defence"
source = "gitoc"
description = "Whether the courts can try organized-crime cases effectively and independently, and whether prisons are run so that they are not controlled by criminal groups. Expert score from 1 to 10."

[[variables]]
key = "prevention"
table = "gitoc"
field = "prevention"
label = "Prevention"
short = "prevention"
phrase = "how much is done to prevent organized crime"
decimals = 1
higher_is = "better"
group = "defence"
source = "gitoc"
description = "Strategies and community programmes that stop organized crime before it takes hold. Expert score from 1 to 10."
